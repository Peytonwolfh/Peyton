<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · PetSitter CRM</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 32px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f7f4ea;
        color: #2e3436;
        text-align: center;
      }
      img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 30px rgba(46, 52, 54, 0.18); }
      h1 { margin: 6px 0 0; font-size: 22px; }
      p { margin: 0; max-width: 22rem; line-height: 1.5; color: #5a625e; }
      button {
        margin-top: 8px;
        border: 0;
        background: #5c7a5e;
        color: #f4ecd6;
        font-size: 16px;
        font-weight: 600;
        padding: 13px 26px;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <img src="/icon-192.png" alt="PetSitter CRM" />
    <h1>You're offline</h1>
    <p>PetSitter CRM needs a connection to load your latest clients, pets, and visits. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
